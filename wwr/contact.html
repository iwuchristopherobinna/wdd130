<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Water Rafting | Contact Us</title>
  <meta name="description" content="Contact White Water Rafting to ask questions, view our location, meet our team, or send reservation inquiries.">
  <meta name="author" content="Iwu Obinna Christopher jr. ">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

  <header>
    <img src="images/splash.png" alt="Splash Water Rafting Logo" class="logo">
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html" class="active">Contact Us</a>
    </nav>
  </header>

  <main class="contact-grid">
    
    <section class="company-heading">
      <h1>White Water Rafting </h1>
      <p class="address">Km 44 Owerri Okigwe rd<br>Owerri, Imo State<br>08038934935<br>obinnachristopher147@gmail.com</p>
    </section>

    
    <div class="map-form-container">

      <section class="map-section">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3021.802315725208!2d-111.8882283!3d40.7607793!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8752f574d75d506d%3A0xb304b72186522c0f!2sSalt%20Lake%20City%2C%20UT!5e0!3m2!1sen!2sus!4v1680000000000!5m2!1sen!2sus" 
        allowfullscreen 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade" 
        title="White Water Rafting Location Map">
      </iframe>
      </section>

      
      <section class="form-section">
        <form action="#" method="post" class="contact-form">
          
          <div class="form-row">
            <label for="username">Name</label>
            <input type="text" id="username" name="username" placeholder="John Doe" required>
          </div>

          <div class="form-row">
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="useremail" placeholder="johndoe@ng.com" required>
          </div>

          <fieldset class="radio-group">
            <legend class="sr-only">Message Purpose</legend>
            <div class="radio-label">Message Purpose</div>
            <div class="radio-options">
              <label><input type="radio" id="general" name="purpose" value="general" checked> General Inquiry</label>
              <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
              <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
            </div>
          </fieldset>

          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Please Subscribe me to the monthyly newsletter</label>
          </div>

          <button type="submit" class="submit-btn">Get in Touch!</button>
        </form>
      </section>
    </div>

    <!-- Employee Section -->
    <section class="team-section">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/employee1.jpg" alt="Employee Profile 1">
          <figcaption>Reservations Manager</figcaption>
        </figure>
        <figure>
          <img src="images/employee2.jpg" alt="Employee Profile 2">
          <figcaption>River team lead</figcaption>
        </figure>
        <figure>
          <img src="images/employee3.jpg" alt="Employee Profile 3">
          <figcaption>Safety Cordinator</figcaption>
        </figure>
        <figure>
          <img src="images/employee4.jpg" alt="Employee Profile 4">
          <figcaption>Regional Manager</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 White Water Rafting | Iwu Obinna Christopher jr. | All Rights Reserved</p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank" rel="noopener">
        <img src="images/facebook.svg" alt="Facebook Icon">
      </a>
      <a href="https://linkedin.com" target="_blank" rel="noopener">
        <img src="images/linkedin.svg" alt="Twitter Icon">
      </a>
      <a href="https://instagram.com" target="_blank" rel="noopener">
        <img src="images/instagram.svg" alt="Instagram Icon">
      </a>
    </nav>
  </footer>

</body>
</html>
