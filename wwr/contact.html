    <!-- Employee Profiles Section -->
    <section class="team-profiles">

        <figure>
          <img src="images/employee1.jpg" alt="Sarah Connor">

    <!-- Contact Form Section -->
    <section class="contact-form-section">
      <h2>Send Us a Message</h2>
      <form action="#" method="post" class="contact-form">
        
        <div class="form-item">
          <label for="username">Your Name:</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-item">
          <label for="useremail">Your Email Address:</label>
          <input type="email" id="useremail" name="useremail" required>
        </div>

        <fieldset class="form-item">
          <legend>Purpose of Message:</legend>
          <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
          <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
          <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
        </fieldset>

        <div class="form-item">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="form-item checkbox-item">
          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </section>
